name: Refresh licensed ETF end-of-day data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 2-6' # after the previous US trading session
permissions:
  contents: write
concurrency:
  group: licensed-market-history-write
  cancel-in-progress: false
jobs:
  licensed-etfs:
    # Disabled unless a written licence explicitly covers PUBLIC WEBSITE DISPLAY
    # and the cached/static JSON use required by this repository.
    if: ${{ vars.MARKET_DATA_PUBLIC_DISPLAY_APPROVED == 'true' && vars.MARKET_DATA_LICENSE_REFERENCE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source code before network access
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile tools/fetch_licensed_etfs.py tools/merge_market_history.py tools/build_market_snapshot.py
      - name: Fetch licensed canonical ETFs, merge with any licensed index history, then derive snapshot
        env:
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
          MARKET_DATA_PUBLIC_DISPLAY_APPROVED: ${{ vars.MARKET_DATA_PUBLIC_DISPLAY_APPROVED }}
          MARKET_DATA_LICENSE_REFERENCE: ${{ vars.MARKET_DATA_LICENSE_REFERENCE }}
        run: |
          set -euo pipefail
          python tools/fetch_licensed_etfs.py \
            --start 2019-01-01 \
            --output docs/data/market_etf_staging.json \
            --publish
          args=(--overlay docs/data/market_etf_staging.json --output docs/data/market_history.json --publish)
          if [ -f docs/data/market_history.json ]; then args=(--base docs/data/market_history.json "${args[@]}"); fi
          python tools/merge_market_history.py "${args[@]}"
          rm -f docs/data/market_etf_staging.json
          python tools/build_market_snapshot.py \
            --input docs/data/market_history.json \
            --output docs/data/market_snapshot.json \
            --publish
      - name: Commit only final authorized website data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/market_history.json docs/data/market_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh licensed canonical ETF EOD data'
            git push origin HEAD:main
          fi
