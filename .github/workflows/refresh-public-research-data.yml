name: Refresh public research data

on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * *'

permissions:
  contents: write

concurrency:
  group: public-research-data-write
  cancel-in-progress: false

jobs:
  refresh-public-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python
        run: |
          python -m py_compile tools/fetch_public_macro.py
      - name: Refresh no-key official/public data
        run: |
          set -euo pipefail
          python tools/fetch_public_macro.py
      - name: Commit refreshed public data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/macro_public.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public macro research data'
            git push origin HEAD:main
          fi
