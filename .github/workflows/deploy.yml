name: Deploy research website
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decide whether public data needs refresh
        id: refresh
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Eq '^(tools/|config/)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch official public data
        if: steps.refresh.outputs.needed == 'true'
        run: python tools/fetch_public_sources.py --require-min-ok 4
      - name: Validate website
        run: python -m unittest discover -s tests -v
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        uses: actions/deploy-pages@v5
        id: deployment
