name: Validate independent research website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile website and data connectors
        run: |
          python -m py_compile tools/fetch_public_sources.py tools/stage_data.py \
            tools/fetch_licensed_etfs.py tools/fetch_licensed_indices.py \
            tools/merge_market_history.py tools/build_market_snapshot.py \
            tools/build_structure_lab.py tools/enrich_cycle_research.py \
            tools/validate_cycle_research.py
      - name: Verify website, offline adapters, licensing and historical snapshot calculations
        run: python -m unittest discover -s tests -v
      - name: Validate frontend JavaScript
        run: |
          for f in docs/research-terminal-v2.js docs/activity-validation.js docs/personal-tiingo.js docs/home.js docs/sector-map.js docs/instrument.js docs/news-archive.js; do node --check "$f"; done
          python - <<'PYCODE'
          import re, subprocess
          from pathlib import Path
          for item in ('index.html','research-hub.html','structure-lab.html','cycle-lab.html','personal-data.html','api-status.html','sector-map.html','instrument.html','news-archive.html'):
              html=(Path('docs')/item).read_text(encoding='utf-8')
              for text in re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',html,re.S|re.I):
                  if text.strip():
                      subprocess.run(['node','--check','-'],input=text,text=True,check=True)
              print('JS OK:',item)
          PYCODE
