<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="S&P 500、Nasdaq-100 与 Dow Jones U.S. 三套行业体系的统一市场地图"><title>Sector Map｜三套行业地图</title><link rel="stylesheet" href="./research-terminal-v2.css"><style>
:root{color-scheme:dark;--bg:#07131f;--panel:#0f2437;--line:#2d4b61;--txt:#e7f3fa;--muted:#9db7c8;--teal:#65d4c1;--red:#ed9a9a;--gold:#f3c987}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#143b51,transparent 38%),var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,'PingFang SC','Microsoft Yahei',sans-serif}.wrap{max-width:1420px;margin:auto;padding:20px}a{color:#a9e6dc;text-decoration:none}a:hover{text-decoration:underline}h1{font-size:clamp(28px,5vw,48px);line-height:1.12;margin:12px 0}h2{font-size:20px;margin:0 0 10px}.muted,.source{color:var(--muted)}.source{font-size:12px}.hero{padding:18px 0 8px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--teal);font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{border:1px solid #385d73;background:#10283a;color:#dceff7;border-radius:999px;padding:9px 14px;cursor:pointer}.tabs button.active{border-color:#70cfc0;background:#173c48}.overview{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;margin:16px 0}.market,.sector{border:1px solid var(--line);background:linear-gradient(145deg,#122b40,#0b1d2d);border-radius:14px;padding:13px;min-width:0}.market b,.sector b{font-size:18px}.market small,.sector small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis}.market .ret,.sector .ret{font:800 18px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;margin-top:9px}.sector-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.sector{position:relative;min-height:176px;transition:.15s ease}.sector[data-tone="up"]{border-color:#39766b;background:linear-gradient(145deg,#153a3b,#10292f)}.sector[data-tone="down"]{border-color:#744e58;background:linear-gradient(145deg,#38242c,#231b27)}.sector[data-tone="flat"]{border-color:#705f42}.sector .tag{display:inline-block;border:1px solid #3c5d70;border-radius:999px;padding:2px 7px;color:#a9c5d4;font-size:10px;margin-bottom:8px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.m{background:#091a29;border:1px solid #233f53;border-radius:8px;padding:7px}.m span{display:block;color:#789aaf;font-size:9px}.m strong{font-size:12px}.sector .go{display:inline-block;margin-top:10px;font-weight:700}.empty{border:1px dashed #45677b;border-radius:12px;padding:18px;color:var(--muted);background:#091b2b}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:9px 0 16px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.up{background:#55c6af}.down{background:#dc8797}.wait{background:#7a8f9d}.panel{border:1px solid var(--line);background:#0d2133;border-radius:14px;padding:16px;margin:18px 0}@media(max-width:1100px){.overview{grid-template-columns:repeat(4,1fr)}.sector-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.overview{grid-template-columns:repeat(2,1fr)}.sector-grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.wrap{padding:12px}.overview,.sector-grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="hero"><div class="eyebrow">SECTOR MAP / MARKET UNIVERSE</div><h1>三套行业地图</h1><p class="muted">S&P 500、Nasdaq-100、Dow Jones U.S. 分开观察。页面只显示真实已接入行情；没有行情时保留行业结构并明确标记“等待数据”。</p></div>
<section><h2>大盘核心资产</h2><div id="overview" class="overview"></div><p id="snapshotStatus" class="source">正在检查 market_snapshot.json…</p></section>
<section class="panel"><div class="tabs" id="tabs"><button class="active" data-system="sp500">S&P 500</button><button data-system="nasdaq100">Nasdaq-100</button><button data-system="dow_us">Dow Jones U.S.</button></div><div class="legend"><span><i class="dot up"></i>当日上涨</span><span><i class="dot down"></i>当日下跌</span><span><i class="dot wait"></i>等待真实行情</span></div><div id="systemNote" class="source"></div><div id="sectorGrid" class="sector-grid" style="margin-top:12px"></div></section>
<section class="panel"><h2>这一页以后怎么读</h2><p class="muted">每个行业卡片统一预留 1D、5D、20D、相对 SPY、20日波动率、活跃度与箱体状态。数据存在才显示数字；没有接入就不估算、不补样本。点击有明确 instrument ID 的卡片进入统一详情页。</p></section>
</main><script>
'use strict';const $=id=>document.getElementById(id);let universe=null,snap={};let current='sp500';
const fmt=(v,d=2)=>Number.isFinite(Number(v))?`${Number(v)>=0?'+':''}${Number(v).toFixed(d)}%`:'—';
async function getJson(path){let r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(`${r.status}`);return r.json()}
function allCore(){return [...(universe.benchmarks||[]),...(universe.major_indices||[])]}
function metric(label,value){return `<div class="m"><span>${label}</span><strong>${value}</strong></div>`}
function renderOverview(){let box=$('overview');box.innerHTML=allCore().map(x=>{let s=snap[x.id]||{};let tone=Number(s.return_1d)>0?'up':Number(s.return_1d)<0?'down':'flat';return `<a class="market" data-tone="${tone}" href="./instrument.html?symbol=${encodeURIComponent(x.id)}"><small>${x.type==='etf'?'ETF':'INDEX'}</small><b>${x.id}</b><small title="${x.name}">${x.name}</small><div class="ret">${fmt(s.return_1d)}</div><small>${s.date?`截至 ${s.date}`:'等待行情数据'}</small></a>`}).join('')}
function renderSystem(){let sys=universe.sector_systems?.[current],grid=$('sectorGrid');$('systemNote').textContent=sys?`${sys.label} · ${sys.basis}`:'未找到行业体系';if(!sys){grid.innerHTML='<div class="empty">行业配置不存在。</div>';return}grid.innerHTML=sys.items.map(x=>{let s=x.id?snap[x.id]||{}:{},v=Number(s.return_1d),tone=Number.isFinite(v)?(v>0?'up':v<0?'down':'flat'):'flat';let title=x.id?`${x.id} · ${x.sector}`:x.sector;let tag=x.status==='taxonomy_only'?'分类已确认 · 行情映射待核验':(x.kind||'SECTOR');let body=`<span class="tag">${tag}</span><div><b>${title}</b><small>${x.name||'等待确认对应的官方指数 / ETF'}</small></div><div class="ret">${fmt(s.return_1d)}</div><div class="metrics">${metric('5D',fmt(s.return_5d))}${metric('20D',fmt(s.return_20d))}${metric('相对SPY',fmt(s.relative_to_spy_20d))}${metric('20D波动',fmt(s.volatility_20d))}${metric('活跃度',Number.isFinite(Number(s.activity_score))?Number(s.activity_score).toFixed(0):'—')}${metric('箱体',s.range_box_state||'—')}</div>${x.id?`<span class="go">查看详情 →</span>`:'<span class="source">只展示已验证分类，不虚构代码</span>'}`;return x.id?`<a class="sector" data-tone="${tone}" href="./instrument.html?symbol=${encodeURIComponent(x.id)}">${body}</a>`:`<article class="sector" data-tone="${tone}">${body}</article>`}).join('')}
async function boot(){try{universe=await getJson('./data/market_universe.json')}catch(e){$('overview').innerHTML='<div class="empty">market_universe.json 读取失败。</div>';return}try{let x=await getJson('./data/market_snapshot.json');let rows=Array.isArray(x)?x:(x.rows||x.instruments||[]);for(let r of rows)if(r?.id)snap[r.id]=r;$('snapshotStatus').textContent=`真实行情快照已载入：${Object.keys(snap).length} 个标的。`; }catch(e){$('snapshotStatus').textContent='行情快照尚未接入；当前只显示已确认的指数 / ETF / 行业结构，不生成假数据。'}renderOverview();renderSystem();$('tabs').onclick=e=>{let b=e.target.closest('button[data-system]');if(!b)return;current=b.dataset.system;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));renderSystem()}}
boot();
</script><script src="./research-terminal-v2.js"></script></body></html>
