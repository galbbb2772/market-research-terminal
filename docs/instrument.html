<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="统一指数与ETF详情页"><title>Instrument Detail｜市场标的详情</title><link rel="stylesheet" href="./research-terminal-v2.css"><style>
:root{color-scheme:dark;--bg:#07131f;--panel:#0e2234;--line:#2d4b61;--txt:#e8f4fa;--muted:#9db7c8;--teal:#65d4c1;--gold:#f3c987}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#153c4b,transparent 35%),var(--bg);color:var(--txt);font:14px/1.55 system-ui,-apple-system,'PingFang SC','Microsoft Yahei',sans-serif}.wrap{max-width:1380px;margin:auto;padding:20px}a{color:#a7e5dc;text-decoration:none}h1{font-size:clamp(30px,5vw,49px);margin:8px 0}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--teal);font-weight:800}.muted,.source{color:var(--muted)}.source{font-size:11px}.head{display:flex;justify-content:space-between;gap:14px;align-items:end;flex-wrap:wrap;padding:18px 0}.chooser{background:#10283a;border:1px solid #36586d;color:var(--txt);padding:9px 12px;border-radius:9px;min-width:210px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kpi,.panel{border:1px solid var(--line);background:linear-gradient(145deg,#112a3e,#0a1d2d);border-radius:14px}.kpi{padding:13px}.kpi span{display:block;color:var(--muted);font-size:10px}.kpi b{font-size:21px}.panel{padding:16px;margin:16px 0}.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}.chart{display:block;width:100%;height:360px}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.m{padding:9px;border:1px solid #28475c;border-radius:9px;background:#091b2a}.m span{display:block;color:#809fb2;font-size:10px}.m strong{display:block;margin-top:2px}.empty{border:1px dashed #45677b;border-radius:11px;padding:18px;color:var(--muted);background:#091a28}.pill{display:inline-block;border:1px solid #3c6073;border-radius:999px;padding:3px 8px;margin-right:6px;color:#b9d3df;font-size:10px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:12px}.grid,.meta{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><a href="./sector-map.html">← 返回行业地图</a><div class="head"><div><div class="eyebrow">UNIFIED INSTRUMENT DETAIL</div><h1 id="title">读取标的…</h1><div id="subtitle" class="muted"></div></div><label class="source">切换标的<br><select id="pick" class="chooser"></select></label></div>
<section id="kpis" class="grid"></section>
<section class="two"><div class="panel"><h2>价格历史</h2><p id="coverage" class="source">检查真实历史数据…</p><canvas id="chart" class="chart"></canvas></div><div class="panel"><h2>标的信息</h2><div id="meta" class="meta"></div><p id="dataNote" class="source"></p></div></section>
<section class="panel"><h2>结构 / 箱体</h2><div id="boxState" class="empty">如果 structure_lab.json 中存在该标的，这里会显示当前箱体及历史箱体摘要；没有数据就保持空白。</div></section>
<section class="panel"><h2>页面数据规则</h2><p class="muted">本页只读取已接入的真实 JSON。指数没有可靠成交量时不生成成交量；未接入的 AUM、持仓数量、行业活跃度等字段显示“—”。所有收益、波动率和回撤都由实际历史数据或经过审核的快照提供。</p></section>
</main><script>
'use strict';const $=id=>document.getElementById(id);let universe,structure=null,snapshot={};let current=new URLSearchParams(location.search).get('symbol')||'SPY';
const pct=v=>Number.isFinite(Number(v))?`${Number(v)>=0?'+':''}${Number(v).toFixed(2)}%`:'—';const num=(v,d=2)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'—';
async function getJson(p){let r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
function instruments(){let out=[];for(let x of [...(universe.benchmarks||[]),...(universe.major_indices||[])])out.push(x);for(let sys of Object.values(universe.sector_systems||{}))for(let x of sys.items||[])if(x.id&&!out.some(y=>y.id===x.id))out.push(x);return out}
function find(id){return instruments().find(x=>x.id===id)}
function kpi(label,value,note=''){return `<div class="kpi"><span>${label}</span><b>${value}</b><small class="source">${note}</small></div>`}
function draw(bars){let c=$('chart'),w=Math.max(320,c.clientWidth),h=Math.max(250,c.clientHeight),d=devicePixelRatio||1;c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);if(!bars?.length){x.fillStyle='#9db7c8';x.font='13px system-ui';x.fillText('该标的尚未接入真实历史K线。',28,45);return}let use=bars.slice(-504),lo=Math.min(...use.map(b=>Number(b[3]))),hi=Math.max(...use.map(b=>Number(b[2]))),pad=(hi-lo)*.06||1;lo-=pad;hi+=pad;let L=50,R=18,T=18,B=35,W=w-L-R,H=h-T-B,X=i=>L+i*W/Math.max(1,use.length-1),Y=v=>T+(hi-v)/(hi-lo)*H;for(let i=0;i<5;i++){let v=lo+(hi-lo)*i/4,y=Y(v);x.strokeStyle='#27475b';x.beginPath();x.moveTo(L,y);x.lineTo(w-R,y);x.stroke();x.fillStyle='#8daabd';x.fillText(v.toFixed(1),4,y+3)}x.strokeStyle='#d9eff6';x.lineWidth=1.4;x.beginPath();use.forEach((b,i)=>i?x.lineTo(X(i),Y(Number(b[4]))):x.moveTo(X(i),Y(Number(b[4]))));x.stroke();x.fillStyle='#8daabd';x.fillText(use[0][0],L,h-10);x.fillText(use.at(-1)[0],Math.max(L,w-105),h-10)}
function calcFromBars(b){if(!b?.length)return{};let close=i=>Number(b[Math.max(0,b.length-1-i)][4]),last=close(0),ret=n=>b.length>n&&close(n)?(last/close(n)-1)*100:null;let peak=Math.max(...b.map(x=>Number(x[4]))),r20=[];for(let i=Math.max(1,b.length-20);i<b.length;i++)r20.push(Number(b[i][4])/Number(b[i-1][4])-1);let vol=r20.length>1?Math.sqrt(r20.reduce((s,v)=>s+v*v,0)/(r20.length-1))*Math.sqrt(252)*100:null;return{close:last,return_1d:ret(1),return_5d:ret(5),return_20d:ret(20),volatility_20d:vol,drawdown_from_peak:peak?(last/peak-1)*100:null,date:b.at(-1)[0]}}
function render(){let info=find(current)||{id:current,name:current,type:'unknown'},hist=structure?.instruments?.[current],bars=hist?.bars||[],derived={...calcFromBars(bars),...(snapshot[current]||{})};$('title').textContent=info.id;$('subtitle').textContent=`${info.name||info.sector||''}${info.sector?` · ${info.sector}`:''}`;$('kpis').innerHTML=[kpi('最近收盘',num(derived.close),derived.date||'等待数据'),kpi('1D',pct(derived.return_1d)),kpi('5D',pct(derived.return_5d)),kpi('20D',pct(derived.return_20d)),kpi('20D波动率',pct(derived.volatility_20d),'年化'),kpi('距历史高点',pct(derived.drawdown_from_peak)),kpi('相对SPY 20D',pct(derived.relative_to_spy_20d)),kpi('箱体状态',derived.range_box_state||'—')].join('');$('meta').innerHTML=`<div class="m"><span>类型</span><strong>${info.type||info.kind||'—'}</strong></div><div class="m"><span>行业</span><strong>${info.sector||'—'}</strong></div><div class="m"><span>角色</span><strong>${info.role||'—'}</strong></div><div class="m"><span>跟踪</span><strong>${info.tracks||'—'}</strong></div>`;$('dataNote').textContent=hist?`历史数据：${hist.source_status||'已载入'}；${hist.start||'—'} 至 ${hist.end||'—'}。`:'该标的尚未出现在 structure_lab.json。';$('coverage').textContent=bars.length?`真实历史K线 ${bars.length} 根；图表最多显示最近约两年。`:'没有历史K线，不绘制演示曲线。';draw(bars);let boxes=hist?.boxes||[];$('boxState').className=boxes.length?'':'empty';$('boxState').innerHTML=boxes.length?`<span class="pill">箱体 ${boxes.length} 个</span><span class="pill">当前/最近 ${boxes.at(-1).id}</span><p class="source">最近箱体：${boxes.at(-1).start_at} — ${boxes.at(-1).end_at||'进行中'}；上沿 ${num(boxes.at(-1).upper)} / 下沿 ${num(boxes.at(-1).lower)}。<br><a href="./structure-lab.html">进入完整箱体研究 →</a></p>`:'如果 structure_lab.json 中存在该标的，这里会显示当前箱体及历史箱体摘要；没有数据就保持空白。';document.title=`${info.id}｜市场标的详情`}
async function boot(){universe=await getJson('./data/market_universe.json');try{structure=await getJson('./data/structure_lab.json')}catch(_){}try{let s=await getJson('./data/market_snapshot.json'),rows=Array.isArray(s)?s:(s.rows||s.instruments||[]);for(let r of rows)if(r?.id)snapshot[r.id]=r}catch(_){}let list=instruments();$('pick').innerHTML=list.map(x=>`<option value="${x.id}" ${x.id===current?'selected':''}>${x.id} · ${x.name||x.sector||''}</option>`).join('');if(!find(current)){current=list[0]?.id||'SPY';$('pick').value=current}$('pick').onchange=()=>{current=$('pick').value;history.replaceState(null,'',`?symbol=${encodeURIComponent(current)}`);render()};render()}
boot().catch(e=>{$('title').textContent='页面数据读取失败';$('subtitle').textContent=String(e)});
</script><script src="./research-terminal-v2.js"></script></body></html>
